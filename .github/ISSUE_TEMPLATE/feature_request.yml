name: Feature request
description: Something llm-top should show or do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like to see?
      description: A sketch of the line or panel is welcome.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it help?
      description: What are you trying to find out or fix when you'd look at it?
  - type: input
    id: setup
    attributes:
      label: Your setup
      placeholder: llama-server / LM Studio, GPU, agent (Qwen Code, ...)
